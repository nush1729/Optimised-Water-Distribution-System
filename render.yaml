services:
  - type: web
    name: harp-wdn
    runtime: python
    plan: free
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements-deploy.txt &&
      cd frontend && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Set to the deployed frontend origin(s) in the Render dashboard, e.g.
      # https://harp-wdn.vercel.app (comma-separated). Left unset, only
      # http://localhost:5173 is allowed, which is wrong for production.
      - key: ALLOWED_ORIGINS
        sync: false
